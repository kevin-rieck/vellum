[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "vellum"
version = "0.1.0"
description = "Windows-first, local push-to-talk dictation"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "pynput>=1.7,<2",
  "pyperclip>=1.9,<2",
  "pystray>=0.19,<1",
  "Pillow>=10,<12",
  "sounddevice>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.13,<2", "ruff>=0.8,<1"]

[project.scripts]
vellum = "vellum.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ctranslate2", "faster_whisper", "pynput", "pyperclip", "pystray", "sounddevice"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
